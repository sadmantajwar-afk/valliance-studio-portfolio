<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Valliance Studio — AI-Powered Digital Agency &amp; Product Laboratory</title>
    <meta name="description" content="Valliance Studio creates world-class digital experiences, intelligent AI agents, custom commerce, and autonomous workflows for international businesses." />
    <meta name="theme-color" content="#0b0908" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Valliance Studio" />
    
    <!-- Google Fonts Delivery -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://connect.facebook.net" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" />

    <!-- Critical Inlined CSS: Guarantees 0ms Instant First Paint on Mobile & Desktop -->
    <style>
      :root {
        color-scheme: dark;
        background-color: #0b0908;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: auto;
      }
      body {
        background-color: #0b0908 !important;
        color: #f7f3eb;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Tight", sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
      }
      #root {
        min-height: 100vh;
        min-height: 100svh;
        background-color: #0b0908;
      }
    </style>
  </head>
  <body style="background-color:#0b0908;color:#f7f3eb;margin:0;padding:0;" class="bg-[#0b0908] text-[#f7f3eb] antialiased selection:bg-[#e8002d] selection:text-[#fff6ec] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
