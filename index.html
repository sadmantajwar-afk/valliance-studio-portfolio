<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Valliance Studio — AI-Powered Digital Agency &amp; Product Laboratory</title>
    <meta name="description" content="Valliance Studio creates world-class digital experiences, intelligent AI agents, custom commerce, and autonomous workflows for international businesses." />
    <meta name="theme-color" content="#08090B" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Valliance Studio" />
    
    <!-- Theme Detection: Defaults to signature Dark Mode unless manually set -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('valliance_theme_v2');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#08090B' : '#F5F3ED');
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts Delivery -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://connect.facebook.net" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" />

    <!-- Critical Theme Base Styles -->
    <style>
      :root[data-theme="dark"], :root:not([data-theme="light"]), html.dark {
        color-scheme: dark;
        background-color: #08090B;
        --bg-page: #08090B;
        --text-primary: #F5F3ED;
      }
      :root[data-theme="light"], html.light {
        color-scheme: light;
        background-color: #F5F3ED;
        --bg-page: #F5F3ED;
        --text-primary: #08090B;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: auto;
      }
      body {
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Tight", sans-serif;
        min-height: 100vh;
        min-height: 100dvh;
        background-color: var(--bg-page);
        color: var(--text-primary);
      }
      #root {
        min-height: 100vh;
        min-height: 100svh;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-[#F3264B] selection:text-[#FFFFFF] min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
